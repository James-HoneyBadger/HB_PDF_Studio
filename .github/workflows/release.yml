name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag vYYYY.W.N (year, ISO week, sequence); must match the version fields'
        required: true
        default: 'v2026.47.0'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Het releasenummer komt uit de versievelden van de repo: de installers
      # en latest.json krijgen hun versie uit tauri.conf.json, de
      # .mcpb uit package.json. Een tag of handmatige invoer die daar niet bij
      # hoort, of niet aan vJJJJ.W.N voldoet, stopt de run hier, voordat er
      # een concept-release of een build is (#667). Eerst bump-version.js,
      # dan committen, dan taggen.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify version fields match the tag
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: node open-pdf-studio/scripts/bump-version.js --check "$VERSION"

      - name: Create release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            // Idempotent: een tag-push nadat de release al bestaat (bv. na
            // handmatige publicatie van een eerder concept) mag geen tweede
            // concept-release + dubbele buildrun veroorzaken. Bestaande
            // release op deze tag (concept of gepubliceerd) wordt hergebruikt;
            // de artefact-uploads verderop overschrijven met --clobber.
            const bestaande = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const hergebruik = bestaande.find((r) => r.tag_name === version);
            if (hergebruik) {
              core.info(`Release voor ${version} bestaat al (id ${hergebruik.id}) — hergebruiken.`);
              return hergebruik.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `HB PDF Studio ${version}`,
              // Tweetalige body: de "## 🇳🇱 Nederlands" / "## 🇬🇧 English"
              // markers worden door de in-app "Wat is nieuw"-dialog geparsed
              // (js/help/release-notes.js) zodat de NL-tab echte Nederlandse
              // tekst toont in plaats van de Engelse fallback (#240).
              body: `## 🇳🇱 Nederlands\n\n### Wat is nieuw in ${version}\n\nGratis, open-source PDF-annotatie-editor gebouwd met Tauri, voor Linux op ARM64.\n\n**Sneller op ARM.** Pagina's worden nu door een pool van PDFium-werkprocessen getekend in plaats van in het hoofdproces. Een grote tekening blokkeert de interface niet meer en een crash in een werkproces laat de app doorlopen. De \`pdfium-worker\` gaat als native \`aarch64\`-sidecar mee in het \`.deb\`-pakket en de AppImage.\n\n### Downloads\n- **Linux AArch64**: download het \`.deb\`-pakket, de \`.AppImage\` of de \`.snap\` (ook beschikbaar in de [Snap Store](https://snapcraft.io/open-pdf-studio))\n\n### Functies\n- PDF's bekijken en navigeren\n- Tekst selecteren en zoeken\n- Annotaties: markeren, onderstrepen, doorhalen\n- Tekengereedschappen: vrije hand, vormen, tekst\n- Meerdere documenten in tabbladen\n- Miniatuurnavigatie\n- Sessieherstel\n\n---\n\n## 🇬🇧 English\n\n### What's New in ${version}\n\nFree, open-source PDF annotation editor built with Tauri, for Linux on ARM64.\n\n**Faster on ARM.** Pages render through a pool of PDFium worker processes instead of the main process. A large drawing no longer blocks the interface, and a worker crash lets the app keep running. The \`pdfium-worker\` ships as a native \`aarch64\` sidecar in the \`.deb\` and the AppImage.\n\n### Downloads\n- **Linux AArch64**: Download the \`.deb\` package, \`.AppImage\`, or \`.snap\` (also available on the [Snap Store](https://snapcraft.io/open-pdf-studio))\n\n### Features\n- PDF viewing and navigation\n- Text selection and search\n- Annotations: highlight, underline, strikethrough\n- Drawing tools: freehand, shapes, text\n- Multi-tab document support\n- Thumbnail navigation\n- Session restore`,
              draft: true,
              prerelease: false
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 'tauri2026'
      # Do not bundle the display stack into the AppImage. Bundled Ubuntu-era
      # libwayland/xkbcommon/xcb shadow the host copies and abort WebKit with
      # "Could not create default EGL display: EGL_BAD_PARAMETER" on newer Mesa
      # (Fedora 44, issue #362). linuxdeploy reads this list; the host provides
      # these libraries. Keep in sync with scripts/linux-appimage-smoke.sh.
      LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*;libxkbcommon.so*;libxcb-randr.so*;libxcb-render.so*;libxcb-shm.so*;libXau.so*;libXdmcp.so*'
    defaults:
      run:
        working-directory: open-pdf-studio

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: open-pdf-studio/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1' # 1.100 breaks tauri-build 2.6.2 (build-dir layout)

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config xdg-utils

      # tesseract-rs compiles Leptonica/Tesseract from source and links them
      # statically (#620). It keeps the sources and static libs in
      # ~/.tesseract-rs, so cache that; the key follows the tesseract-rs pin
      # in the workspace Cargo.toml.
      - name: Cache Tesseract static build (Linux)
        uses: actions/cache@v5
        with:
          path: ~/.tesseract-rs
          key: tesseract-rs-ubuntu-24.04-arm-${{ hashFiles('Cargo.toml') }}

      - name: Install frontend dependencies
        run: npm ci

      # The PDFium worker pool runs as a Tauri sidecar (bundle.externalBin).
      # Tauri requires binaries/pdfium-worker-aarch64-unknown-linux-gnu to
      # exist at build time, so build the workspace crate first and drop it in
      # with the right triple suffix.
      - name: Build pdfium-worker sidecar (Linux)
        working-directory: .
        run: |
          cargo build --release -p pdfium-worker
          mkdir -p open-pdf-studio/src-tauri/binaries
          cp target/release/pdfium-worker open-pdf-studio/src-tauri/binaries/pdfium-worker-aarch64-unknown-linux-gnu

      - name: Prepare PDFium runtime (Linux AArch64)
        run: npm run prepare:native-runtime

      # Tauri 2.10 downloads its own, older linuxdeploy build, which ignores
      # LINUXDEPLOY_EXCLUDED_LIBRARIES, so the display stack ended up in the
      # AppImage anyway (issue #362). Tauri only downloads when the file is not
      # already in its tool cache (~/.cache/tauri), so place a pinned,
      # checksum-verified linuxdeploy release there first.
      - name: Provide pinned linuxdeploy (Linux)
        shell: bash
        run: |
          set -euo pipefail
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/linuxdeploy-aarch64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage
          echo "620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff  $tools/linuxdeploy-aarch64.AppImage" | sha256sum -c -
          chmod +x "$tools/linuxdeploy-aarch64.AppImage"

      - name: Build Tauri app (with release upload)
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-pdf-studio
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true

      # Official Linux packages must not need distro-specific OCR library sonames.
      - name: Verify no system OCR library dependency (Linux)
        run: bash scripts/linux-ocr-linkage-check.sh ../target/release/open-pdf-studio

      # OpenAEC Linux (#863): the SuperCloud runs the EXTRACTED AppImage in a
      # container without FUSE or GPU, under labwc (Wayland), without a session
      # bus, keyring, system tray or notification daemon. Same here: Debian 13,
      # labwc on the wlroots headless backend with the pixman renderer and Mesa
      # llvmpipe, no /dev/dri. The script starts the app twice (without and
      # with a relative file argument), takes a screenshot, measures the memory
      # at rest and checks a clean SIGTERM shutdown (docs/openaec-linux.md).
      - name: Verify AppImage in OpenAEC Linux conditions (Linux)
        shell: bash
        run: |
          appimage=$(find ../target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          appimage=$(realpath "$appimage")
          mkdir -p "$RUNNER_TEMP/openaec-linux"
          docker run --rm \
            -v "$appimage:/input/open-pdf-studio.AppImage:ro" \
            -v "$PWD/scripts/openaec-linux-smoke.sh:/input/openaec-linux-smoke.sh:ro" \
            -v "$RUNNER_TEMP/openaec-linux:/output" \
            debian:13-slim \
            bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends labwc grim libgtk-3-0t64 libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri fonts-dejavu-core && cp /input/open-pdf-studio.AppImage /tmp/open-pdf-studio.AppImage && bash /input/openaec-linux-smoke.sh /tmp/open-pdf-studio.AppImage 15 /output'

      - name: Upload OpenAEC Linux screenshots (Linux)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openaec-linux-smoke
          path: ${{ runner.temp }}/openaec-linux
          if-no-files-found: ignore

      # "Light at rest" (#863): the memory of the running app without a
      # document, measured above, goes into the release notes.
      - name: Add memory at rest to the release notes (Linux)
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          report: ${{ runner.temp }}/openaec-linux/memory-at-rest.txt
        with:
          script: |
            const fs = require('fs');
            const line = fs.readFileSync(process.env.report, 'utf8').trim();
            const { owner, repo } = context.repo;
            const release_id = process.env.release_id;
            const { data } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const marker = '<!-- openaec-memory-at-rest -->';
            const body = (data.body || '').split(marker)[0].trimEnd()
              + `\n\n${marker}\n### OpenAEC Linux\n\n${line}\n`;
            // Keep the verified tag when updating a draft.
            await github.rest.repos.updateRelease({
              owner, repo, release_id, body,
              tag_name: data.tag_name, target_commitish: data.target_commitish,
            });

  mcpb:
    # Claude Desktop-extensie (.mcpb): de stdio-brug plus manifest, ingepakt
    # met de officiele CLI. Hangt niet aan de desktop-builds vast.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extensie bouwen
        run: node mcpb/scripts/pack.mjs

      - name: Aan de release hangen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$VERSION" mcpb/dist/open-pdf-studio.mcpb --clobber --repo "${{ github.repository }}"

  python-library:
    needs: create-release
    # Python-bibliotheek (#518): sdist + wheel van python/, aan de concept-
    # release gehangen. Puur Python (py3-none-any): een wheel voor alle
    # platforms. Publiceren op PyPI is een aparte, handmatige stap (zie
    # docs/python-library.md).
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generated tool layer is up to date
        run: node python/scripts/generate-tools.mjs --check

      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests -t tests -v

      - name: Build sdist and wheel
        run: |
          cp LICENSE.md python/LICENSE.md
          python -m pip install --upgrade build
          python -m build python --outdir python/dist
          ls -l python/dist

      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh release upload "$VERSION" python/dist/open_pdf_studio-${VERSION#v}.tar.gz python/dist/open_pdf_studio-${VERSION#v}-py3-none-any.whl --clobber --repo "${{ github.repository }}"

  flatpak:
    # Flathub readiness (#389): lints the Flatpak and builds it the way Flathub
    # does (sandboxed, offline from the declared sources), then lints the
    # build. Flathub builds and publishes the Flatpak itself, so the bundle is
    # only a workflow artifact for testing, not a release asset, and this job
    # does not gate the release.
    needs: create-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # flatpak-builder, flathub-build and flatpak-builder-lint, the same
          # tools the Flathub builders use.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Validate and lint the Flatpak
        run: bash flatpak/ci-check.sh lint

      - name: Build the Flatpak offline and lint the build
        run: dbus-run-session -- bash flatpak/ci-check.sh build

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: open-pdf-studio-flatpak-${{ needs.create-release.outputs.version }}
          path: org.openaec.OpenPdfStudio.flatpak
          if-no-files-found: error

  # Detached OpenPGP signatures for the Linux packages (#842): <file>.asc for
  # the .deb, the .AppImage and the .snap, plus SHA256SUMS and SHA256SUMS.asc,
  # with the existing OpenAEC release key (organisation secrets
  # OPENAEC_GPG_PRIVATE_KEY and OPENAEC_GPG_PASSPHRASE). Runs after the build
  # job, so the .deb and the AppImage are on the draft, and waits for the snap
  # that snap.yml builds in its own run on the same tag. It only uploads new
  # asset names (.asc, SHA256SUMS); latest.json and the Tauri updater .sig
  # files stay untouched.
  # Without the secret (forks, pull requests) it signs nothing and
  # publish-release reports that.
  sign-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      HAS_OPENPGP_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY != '' }}
      OPENAEC_GPG_EXPECTED_FINGERPRINT: 13F6D414ADEE4ED4CD09AC60601D86C93C504D29
    outputs:
      status: ${{ steps.sign.outputs.status }}
      missing: ${{ steps.sign.outputs.missing }}
    defaults:
      run:
        working-directory: open-pdf-studio

    steps:
      - uses: actions/checkout@v6

      # snap.yml starts on the same tag push and uploads its .snap to this
      # draft when it is done. A manual run of this workflow does not start
      # snap.yml, so then only a snap that is already there counts.
      - name: Wait for the snap on the draft release
        if: env.HAS_OPENPGP_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wait_minutes=0
          if [ "${{ github.event_name }}" = "push" ]; then wait_minutes=60; fi
          deadline=$(( $(date +%s) + wait_minutes * 60 ))
          while :; do
            # Capture first: grep -q closing the pipe early fails it under pipefail.
            names=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate \
              --jq '.[] | select(.state == "uploaded") | .name')
            if grep -q '\.snap$' <<< "$names"; then
              echo "Snap found on the release."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::No .snap on the release after ${wait_minutes} min (snap.yml): the snap is not signed now; snap.yml signs it when it uploads it later."
              break
            fi
            sleep 30
          done

      - name: Sign, upload and verify the Linux assets (OpenPGP)
        id: sign
        shell: bash
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: bash scripts/sign-linux-release.sh release "$VERSION" ../docs/keys/openaec-signing-public-key.asc

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build, sign-linux]

    steps:
      - name: Report the Linux OpenPGP signatures
        shell: bash
        env:
          SIGN_STATUS: ${{ needs.sign-linux.outputs.status }}
          SIGN_MISSING: ${{ needs.sign-linux.outputs.missing }}
        run: |
          if [ "$SIGN_STATUS" = "signed" ] && [ -z "$SIGN_MISSING" ]; then
            msg="Linux OpenPGP signatures: .deb, .AppImage, .snap and SHA256SUMS signed and verified (13F6D414ADEE4ED4CD09AC60601D86C93C504D29)."
            echo "$msg"
          elif [ "$SIGN_STATUS" = "signed" ]; then
            msg="Linux OpenPGP signatures: signed and verified, but no ${SIGN_MISSING} was on the release to sign."
            echo "::warning::$msg"
          else
            msg="Linux OpenPGP signatures: NOT signed, the secret OPENAEC_GPG_PRIVATE_KEY is not available to this run."
            echo "::warning::$msg"
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize release
        id: publish-release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          release_tag: ${{ needs.create-release.outputs.version }}
          release_sha: ${{ github.sha }}
        with:
          script: |
            // Keep the verified tag when updating a draft. Omitting it can
            // turn the release into an untagged draft and break later uploads.
            // Publication remains an explicit maintainer action.
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              tag_name: process.env.release_tag,
              target_commitish: process.env.release_sha,
              draft: true,
              prerelease: false
            });
