name: Nightly Build

# Daily / on-demand builds, published as a rolling pre-release on GitHub.
#
# Difference vs release.yml:
#   - release.yml  → triggered by `v*` semver tags, becomes the "Latest" stable release
#   - nightly.yml  → continuous interim builds, marked prerelease, single rolling tag
#
# Trigger options:
#   - Manual: Actions tab → "Nightly Build" → Run workflow
#     (`gh workflow run nightly.yml --ref main`)
#   - Push to main: every commit (disabled by default; uncomment the push block)
#   - No daily schedule: builds only run when someone asks for one

on:
  workflow_dispatch:
  # Uncomment to also build on every push to main:
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.recreate.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute nightly version + tag
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./open-pdf-studio/package.json').version")
          DATE=$(date -u +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE_VERSION}-nightly.${DATE}.${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "Building nightly ${VERSION}"

      - name: Delete previous nightly release + tag (rolling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Create fresh nightly release (prerelease, draft=false so artifacts upload visibly)
        id: recreate
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.version.outputs.version }}";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "nightly",
              target_commitish: context.sha,
              name: `Nightly build ${version}`,
              body: [
                "🌙 **Nightly / interim build** — not a stable release.",
                "",
                "Built from the latest `main` branch. May contain bugs or incomplete features.",
                "For stable, use the latest `v*` release.",
                "",
                `Source: \`${context.sha.substring(0,7)}\``,
                `Build version: \`${version}\``
              ].join("\n"),
              draft: false,
              prerelease: true
            });
            core.setOutput("release_id", data.id);
            return data.id;

  build-tauri:
    needs: prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 'tauri2026'
      # linuxdeploy/appimagetool need FUSE; extract-and-run avoids requiring a
      # FUSE mount on the CI runner.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # Do not bundle the display stack into the AppImage. Bundled Ubuntu-era
      # libwayland/xkbcommon/xcb shadow the host copies and abort WebKit with
      # "Could not create default EGL display: EGL_BAD_PARAMETER" on newer Mesa
      # (Fedora 44, issue #362). linuxdeploy reads this list; the host provides
      # these libraries. Keep in sync with scripts/linux-appimage-smoke.sh.
      LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*;libxkbcommon.so*;libxcb-randr.so*;libxcb-render.so*;libxcb-shm.so*;libXau.so*;libXdmcp.so*'
    defaults:
      run:
        working-directory: open-pdf-studio

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1' # 1.100 breaks tauri-build 2.6.2 (build-dir layout)

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config

      # tesseract-rs compiles Leptonica/Tesseract from source and links them
      # statically (#620). It keeps the sources and static libs in
      # ~/.tesseract-rs, so cache that; the key follows the tesseract-rs pin
      # in the workspace Cargo.toml.
      - name: Cache Tesseract static build (Linux)
        uses: actions/cache@v5
        with:
          path: ~/.tesseract-rs
          key: tesseract-rs-ubuntu-24.04-arm-${{ hashFiles('Cargo.toml') }}

      - name: Install frontend dependencies
        run: npm ci

      # The PDFium worker pool runs as a Tauri sidecar (bundle.externalBin).
      # Tauri requires binaries/pdfium-worker-aarch64-unknown-linux-gnu to
      # exist at build time, so build the workspace crate first and drop it in
      # with the right triple suffix. Without this step build.rs /
      # tauri_build fails the validation — the cause of the failing nightlies.
      - name: Build pdfium-worker sidecar (Linux)
        working-directory: .
        run: |
          cargo build --release -p pdfium-worker
          mkdir -p open-pdf-studio/src-tauri/binaries
          cp target/release/pdfium-worker open-pdf-studio/src-tauri/binaries/pdfium-worker-aarch64-unknown-linux-gnu

      # The AppImage bundles in-proc PDFium as well as the worker sidecar, so
      # libpdfium.so must be present — referenced by tauri.linux.conf.json.
      - name: Prepare PDFium runtime (Linux AArch64)
        run: npm run prepare:native-runtime

      # Tauri 2.10 downloads its own, older linuxdeploy build, which ignores
      # LINUXDEPLOY_EXCLUDED_LIBRARIES, so the display stack ended up in the
      # AppImage anyway (issue #362). Tauri only downloads when the file is not
      # already in its tool cache (~/.cache/tauri), so place a pinned,
      # checksum-verified linuxdeploy release there first.
      - name: Provide pinned linuxdeploy (Linux)
        shell: bash
        run: |
          set -euo pipefail
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/linuxdeploy-aarch64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage
          echo "620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff  $tools/linuxdeploy-aarch64.AppImage" | sha256sum -c -
          chmod +x "$tools/linuxdeploy-aarch64.AppImage"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-pdf-studio
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: false

      # Official Linux packages must not need distro-specific OCR library sonames.
      - name: Verify no system OCR library dependency (Linux)
        run: bash scripts/linux-ocr-linkage-check.sh ../target/release/open-pdf-studio
